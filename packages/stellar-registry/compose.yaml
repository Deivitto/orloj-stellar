services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orloj
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: orloj_stellar
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["stellar-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orloj -d orloj_stellar"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  stellar-db:
