name: Stellar registry
on:
  push:
    paths: ['packages/stellar-registry/**', 'pnpm-lock.yaml', '.github/workflows/stellar.yml']
  pull_request:
    paths: ['packages/stellar-registry/**', 'pnpm-lock.yaml', '.github/workflows/stellar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orloj
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: orloj_stellar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orloj -d orloj_stellar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orloj:ci-only@127.0.0.1:5432/orloj_stellar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @orloj/stellar-registry
      - run: rustup target add wasm32v1-none
      - name: Build real specification fixture
        working-directory: packages/stellar-registry/demo-contract
        run: |
          cargo build --locked --release --target wasm32v1-none
          mkdir -p artifacts
          cp target/wasm32v1-none/release/orloj_stellar_demo.wasm artifacts/
      - run: pnpm --filter @orloj/stellar-registry typecheck
      - run: pnpm --filter @orloj/stellar-registry test
      - run: pnpm --filter @orloj/stellar-registry build
